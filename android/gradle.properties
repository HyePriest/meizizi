org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep the app's explicit ARM64 filter; Flutter otherwise inserts all supported ABIs.
disable-abi-filtering=true
# Kotlin incremental caches cannot relativize plugin sources on C: against E:.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# flutter_inappwebview_android 1.1.3 (pulled in for the Windows webview) still
# references proguard-android.txt, which AGP 9 rejects by default. Temporary
# opt-out until the plugin is updated; may be removed in a future AGP.
android.r8.proguardAndroidTxt.disallowed=false
